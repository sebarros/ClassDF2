<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        /*Cuerpo del doc*/
        body{
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th{
            background-color: #eee;
        }
        caption{
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        tfoot{
            font-weight: bold;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>Tabla</h1>
    <table>
        <caption>Registro de estudiantes</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>ASIGNATURA</th>
                <th>NOTA</th>
                <th>ESTADO</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Zong Che</td>
                <td>Full Stack II</td>
                <td>4.5</td>
                <td>Activo</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Amaro Villalobos</td>
                <td>Full Stack II</td>
                <td>1.0</td>
                <td>Reprobado</td>
            </tr>
            <tfoot>
                <tr>
                    <td colspan="3">Promedio General</td>
                    <td>3.0</td>
                    <td>Curso Reprobado</td>
                </tr>
            </tfoot>
        </tbody>
    </table>
</body>
</html>
